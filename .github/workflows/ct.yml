# ============================================================
# ct.yml — Continuous Training
# ============================================================
# Covers pipeline stages:
#   1. Data Acquisition & Preprocessing  (ingest job)
#   2. Model Training & Testing          (train job)
#   6. Continuous Training               (scheduled trigger)
#
# Triggered automatically on 1st December each year, aligned
# with the Census Bureau's annual ACS 5-Year data release.
# Can also be triggered manually via workflow_dispatch.
#
# On completion, commits the retrained model back to main so
# the CD workflow picks it up and redeploys automatically.
# ============================================================

name: Continuous Training

on:
  # Runs automatically each December when new ACS data is released
  schedule:
    - cron: "0 9 1 12 *"

  # Allow manual trigger for demos and testing
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------
  # Stage 1: Data Acquisition & Preprocessing
  # ----------------------------------------------------------
  ingest:
    name: Validate ACS Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate dataset
        run: python ingest.py

  # ----------------------------------------------------------
  # Stage 2: Model Training & Testing
  # ----------------------------------------------------------
  train:
    name: Train & Evaluate Model
    runs-on: self-hosted
    needs: ingest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python version
        run: python3 --version

      - name: Install dependencies
        run: pip3 install -r requirements.txt || pip3 install -r requirements.txt --break-system-packages

      - name: Train model and log metrics to MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: python3 train.py

      - name: Commit updated model to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model/income_model.pkl
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: retrain model on ACS 2024 data"
          git push
