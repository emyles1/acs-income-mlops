# ============================================================
# cd.yml — Continuous Delivery & Deployment
# ============================================================
# Covers pipeline stages:
#   3. Model Deployment    (deploy job)
#   5. Continuous Delivery (build-and-push job)
#
# Triggered on every push to 'main', including the model
# commit made by ct.yml after retraining. CT does not commit
# anything back, so there is no loop risk.
#
# Jobs:
#   build-and-push  — Builds the Docker image containing the
#                     trained model and Flask app, then pushes
#                     it to Docker Hub.
#   deploy          — Runs on the self-hosted Google VM runner.
#                     Applies the updated Kubernetes manifests
#                     to the Kind cluster and rolls out the new
#                     image.
# ============================================================

name: Continuous Delivery

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Continuous Training"]
    types:
      - completed

jobs:
  # ----------------------------------------------------------
  # Stage 5: Continuous Delivery — Build & Push Docker Image
  # ----------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_HUB_USERNAME }}/acs-income-predictor:latest \
            -t ${{ secrets.DOCKER_HUB_USERNAME }}/acs-income-predictor:${{ github.sha }} \
            .

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/acs-income-predictor:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/acs-income-predictor:${{ github.sha }}

  # ----------------------------------------------------------
  # Stage 3: Deployment — Apply to Kind Cluster on Google VM
  # ----------------------------------------------------------
  deploy:
    name: Deploy to Kind Cluster
    runs-on: self-hosted        # Google VM self-hosted runner
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Substitute image tag in deployment manifest
        run: |
          sed -i "s|DOCKER_HUB_USERNAME|${{ secrets.DOCKER_HUB_USERNAME }}|g" k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Restart deployment to pull latest image
        run: |
          kubectl rollout restart deployment/acs-income-predictor

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/acs-income-predictor --timeout=120s

      - name: Verify pod is running
        run: |
          kubectl get pods -l app=acs-income-predictor
